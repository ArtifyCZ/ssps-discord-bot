[package]
name = "bootstrap"
authors = [
    "Richard Tichý <tichy@artify.zone>",
]
edition = "2024"

[[bin]]
name = "ssps-discord-bot"
path = "src/main.rs"

[dependencies]
application.workspace = true
application-ports.workspace = true
domain.workspace = true
domain-shared.workspace = true
infrastructure.workspace = true
presentation.workspace = true

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dotenv = "0.15"
oauth2 = "5.0"
poise = "0.7"
sentry = "0.49"
sentry-tracing = "0.49"
serde_json = "1.0"
serenity = { version = "0.12", features = ["full"] }
sqlx = { version = "0.9", features = [ "runtime-tokio", "tls-native-tls", "postgres"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.0"
