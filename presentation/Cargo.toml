[package]
name = "presentation"
edition = "2024"

[dependencies]
application-ports = { path = "../application-ports" }
domain = { path = "../domain" }
domain-shared = { path = "../domain-shared" }

axum = { version = "0.8", features = ["json", "tokio", "tracing", "macros"] }
poise = "0.7"
serde = { version = "1.0", features = ["derive"] }
tokio = "1.54"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
